name: dromnas

services:
  db:
    image: postgres:16-alpine
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_USER: drom
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      TZ: Europe/Paris
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - /volume1/backup/dumps:/dumps
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drom"]
      interval: 1h
      start_period: 60s
      start_interval: 5s

  ekus-api:
    image: postgrest/postgrest:v12.2.3
    container_name: ekus-api
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://ekus_api:${EKUS_DB_PASSWORD}@db:5432/ekus
      PGRST_DB_SCHEMAS: public,v2
      PGRST_DB_ANON_ROLE: ekus_anon
      PGRST_JWT_SECRET: ${EKUS_JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

  cron:
    image: docker:cli
    container_name: cron
    restart: unless-stopped
    environment:
      TZ: CET-1CEST,M3.5.0,M10.5.0/3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backup:/backup:ro
      - /volume1/backup:/volume1/backup
      - ./cron/crontab:/crontab:ro
      - /volume1/docker/repos:/volume1/docker/repos
      - ./vaultwarden:/dromnas/vaultwarden:ro
      - /volume1:/volume1:ro
      - type: bind
        source: /mnt/@usb
        target: /usb
        bind:
          propagation: rslave
    # 2 h 30 : juste avant les instantanés de 3 h
    command: sh -c "apk add --no-cache bash rsync curl >/dev/null; cp /crontab /etc/crontabs/root && crond -f -l 8"

  # carte réseau Tailscale de Caddy : son propre 443, sans gêner le nginx d'UGOS
  ts-web:
    image: tailscale/tailscale:latest
    container_name: ts-web
    restart: unless-stopped
    environment:
      TS_HOSTNAME: dromnas-web
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
    volumes:
      - ./tailscale-web:/var/lib/tailscale
    ports:
      - "8086:8086"

  caddy:
    build: ./caddy
    image: dromnas-caddy
    container_name: caddy
    restart: unless-stopped
    network_mode: service:ts-web
    environment:
      CF_API_TOKEN: ${CF_API_TOKEN}
    volumes:
      - ./caddy:/etc/caddy:ro
      - ./caddy/data:/data
      - ./sites:/srv:ro
      - ./shared:/srv-shared:ro
      - /volume1/backup/etat:/srv-etat:ro
      - /volume1/docker/repos/maisonbudget/ekus/site:/srv/ekus:ro
      - /volume1/docker/repos/ptcg/app:/srv/ptcg:ro
      - /volume1/docker/repos/hub/site:/srv/hub:ro
      - /volume1/docker/repos/daglega/site:/srv/daglega:ro
      - /volume1/docker/repos/codex:/srv/codex:ro
      - /volume1/docker/repos/frambod/site:/srv/frambod:ro
    depends_on:
      - ts-web

  vault:
    image: vaultwarden/server:latest
    container_name: vault
    healthcheck:
      disable: true
    restart: unless-stopped
    environment:
      DOMAIN: https://vault.dromnas.win
      # ouvert le temps de créer ton compte, refermé juste après
      SIGNUPS_ALLOWED: "false"
      TZ: Europe/Paris
    volumes:
      - ./vaultwarden:/data


  ptcg-nas:
    image: filebrowser/filebrowser:latest
    container_name: ptcg-nas
    healthcheck:
      disable: true
    user: "0:0"
    restart: unless-stopped
    volumes:
      - /volume1/applis/ptcg:/srv
      - ./filebrowser:/database

  ptcg-api:
    image: postgrest/postgrest:v12.2.3
    container_name: ptcg-api
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://ptcg_api:${PTCG_DB_PASSWORD}@db:5432/ptcg
      PGRST_DB_SCHEMAS: public,v2
      PGRST_DB_ANON_ROLE: ptcg_anon
      PGRST_JWT_SECRET: ${PTCG_JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

  ptcg-jobs:
    image: node:22-alpine
    container_name: ptcg-jobs
    restart: unless-stopped
    working_dir: /jobs
    environment:
      TZ: CET-1CEST,M3.5.0,M10.5.0/3
    volumes:
      - /volume1/docker/repos/ptcg/jobs:/jobs
      - ./cron/ptcg-jobs:/crontab:ro
    command: sh -c "cp /crontab /etc/crontabs/root && crond -f -l 8"

  hub-api:
    image: postgrest/postgrest:v12.2.3
    container_name: hub-api
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://hub_api:${HUB_DB_PASSWORD}@db:5432/hub
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: hub_anon
    depends_on:
      db:
        condition: service_healthy

  daglega-api:
    image: postgrest/postgrest:v12.2.3
    container_name: daglega-api
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://daglega_api:${DAGLEGA_DB_PASSWORD}@db:5432/daglega
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: daglega_anon
    depends_on:
      db:
        condition: service_healthy

  daglega-uploads:
    image: node:22-alpine
    container_name: daglega-uploads
    restart: unless-stopped
    user: "0:0"
    environment:
      DATA_DIR: /data
      PORT: "3005"
    volumes:
      - /volume1/docker/repos/daglega/uploads-service:/app:ro
      - /volume1/applis/daglega:/data
    command: node /app/server.js

  codex-api:
    image: postgrest/postgrest:v12.2.3
    container_name: codex-api
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://codex_api:${CODEX_DB_PASSWORD}@db:5432/codex
      PGRST_DB_SCHEMAS: v2
      PGRST_DB_ANON_ROLE: codex_anon
      PGRST_JWT_SECRET: ${CODEX_JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

  frambod-api:
    image: postgrest/postgrest:v12.2.3
    container_name: frambod-api
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://frambod_api:${FRAMBOD_DB_PASSWORD}@db:5432/frambod
      PGRST_DB_SCHEMAS: public,v2
      PGRST_DB_ANON_ROLE: frambod_anon
    depends_on:
      db:
        condition: service_healthy

  signal-web:
    build:
      context: /volume1/docker/repos/signal
      dockerfile_inline: |
        FROM python:3.12-slim
        COPY requirements.txt /tmp/
        RUN pip install --no-cache-dir -r /tmp/requirements.txt
    image: dromnas-signal
    container_name: signal-web
    restart: unless-stopped
    working_dir: /app
    environment:
      TZ: CET-1CEST,M3.5.0,M10.5.0/3
    volumes:
      - /volume1/docker/repos/signal:/app
    command: python app.py
    depends_on:
      db:
        condition: service_healthy

  signal-poller:
    image: dromnas-signal
    container_name: signal-poller
    restart: unless-stopped
    working_dir: /app
    environment:
      TZ: CET-1CEST,M3.5.0,M10.5.0/3
    volumes:
      - /volume1/docker/repos/signal:/app
    # un passage toutes les 15 minutes, comme la crontab du Pi
    command: sh -c "while true; do python poller.py >> poller.log 2>&1; sleep 900; done"
    depends_on:
      - signal-web
