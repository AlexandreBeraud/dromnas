name: dromnas

services:
  db:
    image: postgres:16-alpine
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_USER: drom
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      TZ: Europe/Paris
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - /volume1/backup/dumps:/dumps
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drom"]
      interval: 10s

  ekus-api:
    image: postgrest/postgrest:v12.2.3
    container_name: ekus-api
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://ekus_api:${EKUS_DB_PASSWORD}@db:5432/ekus
      PGRST_DB_SCHEMAS: public,v2
      PGRST_DB_ANON_ROLE: ekus_anon
      PGRST_JWT_SECRET: ${EKUS_JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

  cron:
    image: docker:cli
    container_name: cron
    restart: unless-stopped
    environment:
      TZ: CET-1CEST,M3.5.0,M10.5.0/3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backup:/backup:ro
      - /volume1/backup:/volume1/backup
      - ./cron/crontab:/etc/crontabs/root:ro
      - /volume1/docker/repos:/volume1/docker/repos
    # 2 h 30 : juste avant les instantanés de 3 h
    command: sh -c "apk add --no-cache bash >/dev/null; crond -f -l 8"

  # carte réseau Tailscale de Caddy : son propre 443, sans gêner le nginx d'UGOS
  ts-web:
    image: tailscale/tailscale:latest
    container_name: ts-web
    restart: unless-stopped
    environment:
      TS_HOSTNAME: dromnas-web
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
    volumes:
      - ./tailscale-web:/var/lib/tailscale
    ports:
      - "8086:8086"

  caddy:
    build: ./caddy
    image: dromnas-caddy
    container_name: caddy
    restart: unless-stopped
    network_mode: service:ts-web
    environment:
      CF_API_TOKEN: ${CF_API_TOKEN}
    volumes:
      - ./caddy:/etc/caddy:ro
      - ./caddy/data:/data
      - ./sites:/srv:ro
      - /volume1/docker/repos/maisonbudget/ekus/site:/srv/ekus:ro
      - /volume1/docker/repos/ptcg/app:/srv/ptcg:ro
      - /volume1/docker/repos/hub/site:/srv/hub:ro
      - /volume1/docker/repos/daglega/site:/srv/daglega:ro
    depends_on:
      - ts-web

  vault:
    image: vaultwarden/server:latest
    container_name: vault
    restart: unless-stopped
    environment:
      DOMAIN: https://vault.dromnas.win
      # ouvert le temps de créer ton compte, refermé juste après
      SIGNUPS_ALLOWED: "false"
      TZ: Europe/Paris
    volumes:
      - ./vaultwarden:/data


  ptcg-nas:
    image: filebrowser/filebrowser:latest
    container_name: ptcg-nas
    user: "0:0"
    restart: unless-stopped
    volumes:
      - /volume1/applis/ptcg:/srv
      - ./filebrowser:/database

  ptcg-api:
    image: postgrest/postgrest:v12.2.3
    container_name: ptcg-api
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://ptcg_api:${PTCG_DB_PASSWORD}@db:5432/ptcg
      PGRST_DB_SCHEMAS: public,v2
      PGRST_DB_ANON_ROLE: ptcg_anon
      PGRST_JWT_SECRET: ${PTCG_JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

  ptcg-jobs:
    image: node:22-alpine
    container_name: ptcg-jobs
    restart: unless-stopped
    working_dir: /jobs
    environment:
      TZ: CET-1CEST,M3.5.0,M10.5.0/3
    volumes:
      - /volume1/docker/repos/ptcg/jobs:/jobs
      - ./cron/ptcg-jobs:/etc/crontabs/root:ro
    command: crond -f -l 8

  hub-api:
    image: postgrest/postgrest:v12.2.3
    container_name: hub-api
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://hub_api:${HUB_DB_PASSWORD}@db:5432/hub
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: hub_anon
    depends_on:
      db:
        condition: service_healthy

  daglega-api:
    image: postgrest/postgrest:v12.2.3
    container_name: daglega-api
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://daglega_api:${DAGLEGA_DB_PASSWORD}@db:5432/daglega
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: daglega_anon
    depends_on:
      db:
        condition: service_healthy

  daglega-uploads:
    image: node:22-alpine
    container_name: daglega-uploads
    restart: unless-stopped
    user: "0:0"
    environment:
      DATA_DIR: /data
      PORT: "3005"
    volumes:
      - /volume1/docker/repos/daglega/uploads-service:/app:ro
      - /volume1/applis/daglega:/data
    command: node /app/server.js
