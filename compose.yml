name: dromnas

services:
  db:
    image: postgres:16-alpine
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_USER: drom
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      TZ: Europe/Paris
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - /volume1/backup/dumps:/dumps
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drom"]
      interval: 10s

  ekus-api:
    image: postgrest/postgrest:v12.2.3
    container_name: ekus-api
    restart: unless-stopped
    environment:
      PGRST_DB_URI: postgres://ekus_api:${EKUS_DB_PASSWORD}@db:5432/ekus
      PGRST_DB_SCHEMAS: public,v2
      PGRST_DB_ANON_ROLE: ekus_anon
      PGRST_JWT_SECRET: ${EKUS_JWT_SECRET}
    depends_on:
      db:
        condition: service_healthy

  cron:
    image: docker:cli
    container_name: cron
    restart: unless-stopped
    environment:
      TZ: CET-1CEST,M3.5.0,M10.5.0/3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backup:/backup:ro
      - /volume1/backup:/volume1/backup
    # 2 h 30 : juste avant les instantanés de 3 h
    command: sh -c "echo '30 2 * * * /backup/dump.sh >> /volume1/backup/dumps/cron.log 2>&1' | crontab - && crond -f -l 8"

  # carte réseau Tailscale de Caddy : son propre 443, sans gêner le nginx d'UGOS
  ts-web:
    image: tailscale/tailscale:latest
    container_name: ts-web
    restart: unless-stopped
    environment:
      TS_HOSTNAME: dromnas-web
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
    volumes:
      - ./tailscale-web:/var/lib/tailscale
    ports:
      - "8086:8086"

  caddy:
    build: ./caddy
    image: dromnas-caddy
    container_name: caddy
    restart: unless-stopped
    network_mode: service:ts-web
    environment:
      CF_API_TOKEN: ${CF_API_TOKEN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./sites:/srv:ro
      - /volume1/docker/repos/maisonbudget/ekus/site:/srv/ekus:ro
    depends_on:
      - ts-web
